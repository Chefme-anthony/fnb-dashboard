<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F&B Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#0b2545;--blue:#13315c;--gold:#c9a24b;--bg:#f4f6f9;--card:#fff;--text:#1a1f29;--sub:#5b6474;--border:#e2e6ed}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--navy);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:18px;margin:0}header input{background:var(--blue);border:1px solid #45628b;color:#fff;padding:8px;border-radius:6px}nav{background:var(--blue);display:flex;overflow:auto}nav button{background:none;border:0;color:#dce5f2;padding:14px 18px;cursor:pointer;border-bottom:3px solid transparent}nav button.active{color:#fff;border-color:var(--gold)}main{max-width:1400px;margin:auto;padding:18px}.page{display:none}.page.active{display:block}.tools,.card,.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.tools button,.tools label{background:var(--navy);color:#fff;padding:8px 12px;border-radius:6px;border:0;cursor:pointer}.tools input{max-width:220px}.kpis{display:flex;gap:12px;flex-wrap:wrap}.kpi{flex:1;min-width:140px}.kpi b{display:block;font-size:22px;margin-bottom:5px}.muted,small{color:var(--sub)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}h2{font-size:13px;text-transform:uppercase;color:var(--sub);margin:0 0 12px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}th{font-size:10px;text-transform:uppercase;color:var(--sub)}canvas{height:260px!important}@media(max-width:800px){.c4,.c6,.c8{grid-column:span 12}}
</style></head>
<body>
<header><h1 id="title">F&B DASHBOARD</h1><input id="outlet" placeholder="Outlet / property name"></header>
<nav><button class="active" data-tab="high">High Level</button><button data-tab="items">Item Toplist</button><button data-tab="cost">F&B Cost of Sales</button></nav>
<main><div class="tools"><label for="file">Upload Excel</label><input id="file" type="file" accept=".xlsx,.xls"><button id="sample">Load Sample</button><span id="status" class="muted">Data stays in your browser.</span></div>
<section id="high" class="page active"><div class="kpis" id="kpis"></div><div class="grid"><div class="card c6"><h2>Daily Trend</h2><canvas id="trend"></canvas></div><div class="card c6"><h2>Sales by Meal Period</h2><div id="meals"></div></div><div class="card c6"><h2>Food Checks</h2><div id="food"></div></div><div class="card c6"><h2>Beverage Checks</h2><div id="bev"></div></div><div class="card c12"><h2>Sales by Major Division</h2><div id="divisions"></div></div></div></section>
<section id="items" class="page"><div class="card"><h2>Item Toplist</h2><div id="itemsTable"></div></div></section>
<section id="cost" class="page"><div class="grid"><div class="card c8"><h2>F&B Cost of Sales Trend</h2><canvas id="costChart"></canvas></div><div class="card c4"><h2>Overall Cost</h2><div id="overall"></div></div><div class="card c12"><h2>Menu Toplist — Cost of Sales %</h2><div id="menu"></div></div></div></section></main>
<script>
const DATA={outlet:'HD (Hay Diner)',kpis:[['Revenue','₱32.23M'],['Covers','60,531'],['Ave Check','₱532'],['Food Cost %','28.7%'],['Beverage Cost %','27.5%']],months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'],sales:[3974330,3521010,3354968,3625787,4865712,4597899,4771868,3151596],cost:[30.7,35.5,33,30.1,28.4,28.8,29.9,29.3],meals:[['Breakfast',9153090,6582],['Lunch',12065858,7958],['Snacks',6294120,4853],['Dinner',4350102,2972]],food:[['BREAKFAST ALA-CARTE',12074274,29797],['SANDWICH & BURGER',3665244,8529],['APPETIZER',2586645,7224],['PASTA & NOODLE',1894677,4375]],bev:[['COFFEE',3702072,732513],['SHAKE & SMOOTHIE',1106850,5029],['CHOCOLATE DRINKS',699850,5272],['TEA',406083,5470]],divisions:[['FOOD',28844176,'90.6%'],['BEVERAGE',2496976,'7.8%'],['COGS',434354,'1.4%']],items:[['HD FRIED STEAK & EGG',9608,5011836],['HD CHICKEN & WAFFLE',8065,2975799],['HD MINI STEAK SKLT',2940,1501013],['HD CHICKEN WINGS & FRIES',3042,1448518],['HD CHICK PARM',3323,1441876],['HD HAY BURGER',2540,1316518]],menu:[['HD FRIED STEAK & EGG','28.9%'],['HD CHICKEN & WAFFLE','22.6%'],['HD MINI STEAK SKLT','30.5%'],['HD CHICKEN WINGS & FRIES','32.3%'],['HD CHICK PARM','34.4%']],overall:[['Food Cost %','28.7%'],['Beverage Cost %','27.5%'],['Blended F&B Cost %','28.6%'],['Total F&B Cost','₱8,977,903']]};
let charts={};const fmt=n=>Number(n).toLocaleString();function table(id,headers,rows){document.getElementById(id).innerHTML='<table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+ (typeof x==='number'?fmt(x):x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function chart(id,type,labels,datasets){if(charts[id])charts[id].destroy();charts[id]=new Chart(document.getElementById(id),{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false}})}function render(){document.getElementById('title').textContent=(DATA.outlet||'F&B DASHBOARD')+' — F&B DASHBOARD';document.getElementById('outlet').value=DATA.outlet;document.getElementById('kpis').innerHTML=DATA.kpis.map(x=>'<div class="kpi"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('');table('meals',['Period','Sales','Checks'],DATA.meals);table('food',['Category','Sales','Qty'],DATA.food);table('bev',['Category','Sales','Qty'],DATA.bev);table('divisions',['Division','Sales','Share'],DATA.divisions);table('itemsTable',['Item','Qty','Sales'],DATA.items);table('menu',['Item','Cost %'],DATA.menu);table('overall',['Metric','Value'],DATA.overall);chart('trend','line',DATA.months,[{label:'Sales',data:DATA.sales,borderColor:'#c9a24b',tension:.3}]);chart('costChart','line',DATA.months,[{label:'F&B Cost %',data:DATA.cost,borderColor:'#0b2545',tension:.3}])}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.getElementById('outlet').onchange=e=>{DATA.outlet=e.target.value;render()};document.getElementById('sample').onclick=()=>{render();document.getElementById('status').textContent='Sample data loaded.'};document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=x=>{try{let wb=XLSX.read(x.target.result,{type:'array'});document.getElementById('status').textContent='Workbook loaded: '+f.name+' (sample view retained; workbook is available locally).'}catch(err){document.getElementById('status').textContent='Could not read workbook.'}};reader.readAsArrayBuffer(f)};render();
</script></body></html>
